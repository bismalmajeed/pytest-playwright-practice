name: Tests

on: [push, pull_request]

jobs:
  pytest-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Pure pytest practice (no browser or credentials needed)
        run: pytest pytestDir -v
